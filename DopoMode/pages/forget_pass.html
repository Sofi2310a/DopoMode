
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — DopaMode</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Silkscreen:wght@700&family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/forget_pass.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="../index.html" class="logo">DopaMode</a>

            <nav class="nav">
                <a href="/index.html">Main</a>
                <a href="/pages/about.html">About Us</a>
            </nav>

            <div class="header-buttons">
                <a href="/pages/log_in.html" class="btn-login">Log in</a>
                <a href="/pages/sign_in.html" class="btn-signin">Sign in</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        <section class="form-section">
            <h1 class="form-title">Sign in</h1>
            <p class="form-subtitle">Forget Password?</p>

            <form class="reset-form">
                <input type="email" class="form-input" placeholder="Enter E-mail" required>
                <input type="password" class="form-input" placeholder="Enter new password" required>
                <button type="button" class="reset-btn">Reset</button>
            </form>
        </section>

        <section class="image-section">
            <img src="/images/forget_password.png" alt="Detective Rabbit" class="character-img">
        </section>
    </main>
</body>
</html>
