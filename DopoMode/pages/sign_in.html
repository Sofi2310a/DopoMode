<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sign_in.css">
</head>
<body>

    <header class="header-wrapper">
        <div class="header">
            <a href="/index.html" class="logo">DopaMode</a>

            <nav class="nav">
                <a href="/index.html" class="nav-link">Main</a>
                <a href="/pages/about.html" class="nav-link">About Us</a>
            </nav>

            <div class="header-actions">
                <a href="/pages/log_in.html" class="btn-login">Log in</a>
                <a href="/pages/sign_in.html" class="btn-signin">Sign in</a>
            </div>
        </div>
    </header>   

    <main class="main-container">
        <div class="form-section">
            <h1 class="form-title">Sign in</h1>

            <div class="social-buttons">
                <a href="#" class="social-btn" aria-label="Google">G</a>
                <a href="#" class="social-btn" aria-label="Facebook">f</a>
                <a href="#" class="social-btn" aria-label="GitHub">
                    <img src="/images/github.png" alt="GitHub" width="20" height="20">
                </a>
                <a href="#" class="social-btn" aria-label="LinkedIn">in</a>
            </div>

            <p class="form-subtitle">Sign in with E-mail & Password</p>

            <form class="signin-form">
                <input type="email" class="form-input" placeholder="Enter E-mail" required>
                <input type="password" class="form-input" placeholder="Enter Password" required>
                
                <a href="/pages/forget_pass.html" class="forgot-link">Forget Password?</a>

                <a href="/pages/main.html" class="submit-btn">Sign in</a>
            </form>
        </div>

        <div class="image-section">
            <img src="/images/груша.png" alt="Pear character" class="character-img">
        </div>
    </main>

</body>
</html>
